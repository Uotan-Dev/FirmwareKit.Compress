name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [ Release ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore FirmwareKit.Compress.slnx

      - name: Build (Release)
        run: dotnet build FirmwareKit.Compress.slnx -c Release --no-restore

      - name: Test
        run: dotnet test FirmwareKit.Compress.Tests/FirmwareKit.Compress.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Pack (dry-run)
        run: dotnet pack FirmwareKit.Compress/FirmwareKit.Compress.csproj -c Release --no-build -o artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
        continue-on-error: true

      - name: Upload packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
        continue-on-error: true
